<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Argus brand mark (the gradient ring from .brand-mark in index.css) on the app's dark ground. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset=".45" stop-color="#a78bfa"/>
      <stop offset=".8" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b0c0f"/>
  <rect x="116" y="116" width="280" height="280" rx="88" fill="url(#ring)"/>
  <rect x="180" y="180" width="152" height="152" rx="40" fill="#0b0c0f" fill-opacity=".72"/>
</svg>
